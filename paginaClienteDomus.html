<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#394829" />
    <meta
      name="description"
      content="Domus. Encontre um espaço que acompanha o seu jeito de viver."
    />
    <title>Domus — Espaços para viver</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <header>
      <a class="brand" href="/#/" aria-label="Domus, início"
        ><img src="/assets/logo.png" alt="DOMUS" /></a
      ><button
        class="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        ☰
      </button>
      <nav aria-label="Navegação principal">
        <a href="/#/imoveis">Encontrar imóvel</a><a href="/#/sobre">A Domus</a
        ><a href="/#/contato">Contato</a>
      </nav>
      <a class="account-link" href="/#/login">Minha conta →</a>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <div class="footer-top">
        <a class="brand" href="/#/">DOMUS →</a>
        <p>O seu próximo capítulo<br />começa com um espaço.</p>
        <a href="/#/imoveis">Encontre o seu →</a>
      </div>
      <div class="footer-bottom">
        <span>DOMUS © <span id="year"></span></span
        ><a href="/#/privacidade">Privacidade</a
        ><a href="/#/anunciar">Anunciar um imóvel →</a>
      </div>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <button class="close" aria-label="Fechar">×</button>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
